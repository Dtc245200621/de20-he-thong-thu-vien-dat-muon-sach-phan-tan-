<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký độc giả · Mộc</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css"><style>.register-card{max-width:520px;margin:8vh auto;background:#fff;padding:42px;box-shadow:0 10px 40px #203b3112}.register-card input{display:block;width:100%;margin:8px 0 18px;box-sizing:border-box}.register-card label{font-size:14px}.register-card .submit-button{width:100%}</style></head><body class="auth-page"><main class="register-card"><a class="brand" href="index.html"><span class="brand-mark">m</span><span>mộc<span class="brand-sub"> thư viện</span></span></a><p class="eyebrow">TÀI KHOẢN THƯ VIỆN</p><h1>Đăng ký độc giả</h1><p>Tạo tài khoản để đặt sách và theo dõi phiếu mượn.</p><form id="register-form"><label for="name">Họ và tên</label><input class="auth-input" id="name" name="name" required maxlength="160" autocomplete="name"><label for="email">Email</label><input class="auth-input" id="email" name="email" type="email" required autocomplete="email"><label for="phone">Số điện thoại</label><input class="auth-input" id="phone" name="phone" type="tel" required pattern="[0-9+()\\s.-]{9,20}" autocomplete="tel"><label for="password">Mật khẩu (ít nhất 8 ký tự)</label><input class="auth-input" id="password" name="password" type="password" required minlength="8" autocomplete="new-password"><button class="submit-button" type="submit">Tạo tài khoản →</button><p class="form-feedback" id="feedback" role="status"></p></form><p class="auth-footnote">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p></main><script src="register.js" defer></script></body></html>
