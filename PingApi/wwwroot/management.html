<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý thư viện · Mộc</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f7f7f1;color:#203b31;font-family:Arial,sans-serif;margin:0}.manage{max-width:1120px;margin:40px auto;padding:24px}.manage header{display:flex;justify-content:space-between;align-items:center}.manage nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.manage button,.manage a.btn{background:#315343;color:white;border:0;padding:10px 14px;cursor:pointer;text-decoration:none}.manage section{background:#fff;padding:22px;margin:18px 0;border:1px solid #e6e5dc}.manage input,.manage select,.manage textarea{padding:9px;border:1px solid #d4d6cc;margin:4px;max-width:100%}.manage table{border-collapse:collapse;width:100%;margin-top:16px}.manage th,.manage td{text-align:left;border-bottom:1px solid #e6e5dc;padding:10px 6px}.cards{display:flex;gap:14px;flex-wrap:wrap}.cards article{background:#eeefe5;padding:18px;min-width:130px}.error{color:#a34b42}.hidden{display:none}
</style></head><body><main class="manage"><header><div><a href="index.html">← Về thư viện</a><h1>Quản lý thư viện</h1></div><span id="staff-name"></span></header><nav><a class="btn" href="#books">Quản lý sách</a><a class="btn" href="#reservations">Phiếu đặt và mượn</a><a class="btn admin hidden" href="#readers">Độc giả</a><a class="btn admin hidden" href="#statistics">Thống kê</a></nav><p id="notice" role="status"></p>
<section id="books"><h2>Danh mục sách</h2><form id="book-form"><input type="hidden" name="id"><input name="title" placeholder="Tên sách" required><input name="author" placeholder="Tác giả" required><input name="category" placeholder="Thể loại" required><input name="publishedYear" type="number" placeholder="Năm" required><input name="totalCopies" type="number" min="0" placeholder="Tổng bản" required><input name="coverKey" placeholder="Mã bìa"><input name="tag" placeholder="Nhãn"><input name="description" placeholder="Mô tả"><button>Lưu sách</button><button type="reset">Làm mới</button></form><table><thead><tr><th>Sách</th><th>Thể loại</th><th>Còn / tổng</th><th></th></tr></thead><tbody id="book-rows"></tbody></table></section>
<section id="reservations"><h2>Phiếu đặt / mượn</h2><select id="reservation-filter"><option value="">Tất cả</option><option>Pending</option><option>Reserved</option><option>Borrowed</option><option>Returned</option><option>Rejected</option><option>Cancelled</option></select><button id="reload-reservations">Tải danh sách</button><table><thead><tr><th>Độc giả</th><th>Sách</th><th>Trạng thái</th><th>Hạn trả</th><th>Thao tác</th></tr></thead><tbody id="reservation-rows"></tbody></table></section>
<section id="readers" class="admin hidden"><h2>Quản lý độc giả</h2><table><thead><tr><th>Độc giả</th><th>Email</th><th>Điện thoại</th><th>Trạng thái</th><th></th></tr></thead><tbody id="reader-rows"></tbody></table></section>
<section id="statistics" class="admin hidden"><h2>Thống kê thư viện</h2><div class="cards" id="stat-cards"></div><h3>Sách được mượn nhiều</h3><ol id="popular-books"></ol></section></main><script src="management.js" defer></script></body></html>
